# Cloudflare Wrangler config for tracelane-site (Pages + D1).
# See: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "tracelane-site"
compatibility_date = "2026-05-20"
pages_build_output_dir = "dist"

# D1 binding for /api/notify Pages Function.
# Run `pnpm dlx wrangler d1 create tracelane-notify` then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "tracelane-notify"
database_id = "8a8128d8-451c-43df-ad91-f0a9c7c70a70"
migrations_dir = "migrations"
