# Cloudflare Workers config for tracelane-site (static assets + D1).
# Project deploys via `wrangler deploy` with [assets] directory.

name = "tracelane-site"
compatibility_date = "2026-05-20"
main = "functions/api/notify.ts"

[assets]
directory = "./dist"
# Required for `env.ASSETS` to exist in the Worker. Without it the binding is
# undefined and every asset-miss path throws (CF 1101) instead of 404ing.
# `not_found_handling` is deliberately NOT set: it would make the asset handler
# answer misses itself, and POST /api/notify is an asset miss.
binding = "ASSETS"

# D1 binding for /api/notify
[[d1_databases]]
binding = "DB"
database_name = "tracelane-notify"
database_id = "8a8128d8-451c-43df-ad91-f0a9c7c70a70"
migrations_dir = "migrations"
